<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI QA Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      padding: 16px;
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #fafafa;
    }
    h3 { margin: 0 0 12px; font-size: 1.1rem; }
    textarea {
      flex: 1;
      margin-bottom: 12px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: none;
      font-size: 0.9rem;
    }
    button {
      padding: 10px;
      background: #1565c0;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
    }
    button:disabled { background: #9e9e9e; cursor: not-allowed; }
    #status {
      font-size: 0.85rem;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .step {
      margin: 6px 0;
      padding: 6px 8px;
      border-left: 4px solid #ccc;
      background: #fff;
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .step.processing { border-left-color: #1976d2; background: #e3f2fd; }
    .step.success { border-left-color: #2e7d32; background: #e8f5e9; }
    .step.error { border-left-color: #c62828; background: #ffebee; }
  </style>
</head>
<body>
  <h3>Сценарий (RU/EN)</h3>
  <textarea id="scenario" placeholder="1. Нажми кнопку Войти
Результат: Открылась форма логина

2. Введи логин admin
3. Нажми Войти
Результат: Вы успешно авторизовались"></textarea>
  <button id="runBtn">▶ Запустить сценарий</button>
  <div id="status"></div>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
