<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI QA Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1e1e2f;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .panel-container {
      padding: 16px;
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 12px;
    }
    h3 {
      font-size: 1.1rem;
      margin: 0;
      color: #b388ff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    textarea {
      flex: 1;
      background: #2a2a3c;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.9rem;
      resize: vertical;
      min-height: 200px;
      transition: border-color 0.2s;
    }
    textarea:focus {
      outline: none;
      border-color: #b388ff;
    }
    button {
      padding: 10px 16px;
      background: #6c5ce7;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:hover {
      background: #7c6ff0;
    }
    button:disabled {
      background: #9e9e9e;
      cursor: not-allowed;
    }
    #status {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .step-card {
      background: #2a2a3c;
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 4px solid #4caf50;
      transition: all 0.3s;
      word-break: break-word;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .step-card.processing {
      border-left-color: #ffd700;
      background: #3a3a4c;
    }
    .step-card.success {
      border-left-color: #4caf50;
      background: #2a3a2f;
    }
    .step-card.error {
      border-left-color: #f44336;
      background: #3a2222;
    }
    .step-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }
    .step-content {
      flex: 1;
    }
    .step-action {
      font-weight: 500;
    }
    .expected-result {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="panel-container">
    <h3>🤖 AI QA Сценарий (RU/EN)</h3>
    <textarea id="scenario" placeholder="Пример:
1. Нажми кнопку Войти
Результат: открылась форма авторизации

2. Введи логин admin
3. Нажми Войти
Результат: Вы успешно авторизовались"></textarea>
    <button id="runBtn">▶ Запустить сценарий</button>
    <div id="status"></div>
  </div>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
