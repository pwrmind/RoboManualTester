<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI QA Assistant</title>
  <style>
    body { font-family: sans-serif; padding: 15px; display: flex; flex-direction: column; height: 100vh; margin: 0; box-sizing: border-box; }
    textarea { flex-grow: 1; margin-bottom: 10px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; resize: none; }
    button { padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #ccc; }
    #status { margin-top: 10px; font-size: 14px; }
    .step { margin: 5px 0; padding: 5px; border-left: 3px solid #eee; }
    .success { border-left-color: #28a745; background: #f4fff4; }
    .error { border-left-color: #dc3545; background: #fff4f4; }
  </style>
</head>
<body>
  <h3>Сценарий теста (RU)</h3>
  <textarea id="scenario" placeholder="1. Нажми кнопку Войти&#10;2. Результат: Вижу поле Логин"></textarea>
  <button id="runBtn">Запустить сценарий</button>
  <div id="status"></div>

  <script src="sidepanel.js" type="module"></script>
</body>
</html>
